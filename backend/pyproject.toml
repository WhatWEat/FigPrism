[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "figprism"
version = "0.1.0"
description = "A figure-first research gallery"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "pyyaml>=6,<7", "PyJWT>=2.10,<3",
  "argon2-cffi>=23,<26", "python-multipart>=0.0.20,<1", "pymupdf>=1.25,<2",
  "Pillow>=11,<13", "numpy>=2,<3", "defusedxml>=0.7,<1", "typer>=0.15,<1",
  "blurhash>=1.1,<2", "onnxruntime>=1.20,<2", "opencv-python-headless>=4.10,<5"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
layout = ["doclayout-yolo>=0.0.3"]
[project.scripts]
figprism = "figprism.cli:app"
[tool.setuptools.packages.find]
where = ["."]
include = ["figprism*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

asyncio_default_fixture_loop_scope = "function"
