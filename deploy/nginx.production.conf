# Explicitly trust the new public origin while the running backend retains its
# existing CSRF origin. Unknown origins are forwarded unchanged and rejected.
# This avoids restarting active ingestion/backfill jobs during the domain move.
map $http_origin $figprism_ai4any_origin {
    default $http_origin;
    "https://figprism.ai4any.com" "https://fig.zhcanfly.com";
}
# Install as /etc/nginx/sites-available/figprism.ai4any.com.
# TLS is added by certbot --nginx after DNS resolves to this server.
server {
    server_name figprism.ai4any.com;
    include /etc/nginx/snippets/figprism-cloudflare-realip.conf;
    client_max_body_size 52m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location /api/stream/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Origin $figprism_ai4any_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        gzip off;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Origin $figprism_ai4any_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_request_buffering off;
        proxy_cache off;
    }
    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/figprism.ai4any.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/figprism.ai4any.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = figprism.ai4any.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name figprism.ai4any.com;
    return 404; # managed by Certbot


}