# Preserve existing links after moving FigPrism to fig.zhcanfly.com.
# Install as /etc/nginx/sites-available/figprsim.zhcanfly.com.
server {
    listen 80;
    listen [::]:80;
    server_name figprsim.zhcanfly.com;
    return 308 https://figprism.ai4any.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name figprsim.zhcanfly.com;
    ssl_certificate /etc/letsencrypt/live/figprsim.zhcanfly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/figprsim.zhcanfly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://figprism.ai4any.com$request_uri;
}
