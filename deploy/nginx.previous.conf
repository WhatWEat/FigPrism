# Preserve old links; certificate is renewed by certbot's nginx plugin.
server {
    listen 80;
    listen [::]:80;
    server_name fig.zhcanfly.com;
    return 308 https://figprism.ai4any.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fig.zhcanfly.com;
    ssl_certificate /etc/letsencrypt/live/fig.zhcanfly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fig.zhcanfly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://figprism.ai4any.com$request_uri;
}
