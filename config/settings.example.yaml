# Copy to local.yaml (ignored by Git), or run scripts/convert_config.py.
secret_key: replace-with-a-random-secret-at-least-32-characters
public_origin: http://localhost:3000
cookie_secure: false # set true behind HTTPS
webdav:
  url: https://dav.example.com
  username: your-username
  password: your-password
  root: /figprism
vision:
  driver: openai_mini # or codex_subagent; manual review queue, no API calls
  base_url: https://api.openai.com/v1
  api_key: your-api-key
  model: gpt-4.1-mini
# Optional local DocLayout-YOLO checkpoint. Without it, conservative geometry detection
# queues crops for review instead of claiming model-level accuracy.
layout_model: null
hf_min_upvotes: 20
# Shared budget for pending uploads, thumbnails, PDFs and HD cache (3 GB maximum).
cache_max_bytes: 3000000000
favorite_cache_bytes: 500000000 # reserved within the total budget
# Stage limits are shared across API/CLI/timer processes using the data volume.
# Restart all coordinators together after changing limits.
pipeline:
  pending_jobs: 12
  metadata: 4
  download: 3
  papers: 2
  cpu: 2
  cpu_threads: 1
  vision: 3
  upload: 4
  figures: 6 # global cap on rendered figures waiting for downstream stages
  per_paper_figures: 3
  retry_attempts: 3
  arxiv_interval: 3
